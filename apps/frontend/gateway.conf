# The gateway of the compose profile "local". Compose mounts this file at
# /etc/nginx/conf.d/default.conf. It sends the backend paths to the backend and all the rest
# to the frontend. /meta/webhook goes to the frontend, which answers 503: Meta cannot reach
# 127.0.0.1. The list of paths is the same as in nginx.conf and README.md.

# Docker DNS. With a variable in proxy_pass, nginx resolves the name at request time. So the
# gateway starts with a stopped backend, and follows a new container.
resolver 127.0.0.11 valid=5s ipv6=off;

server {
    listen 8080;
    server_name _;

    server_tokens off;
    # An address can hold a token, and an error line holds the address of the client.
    access_log off;
    error_log /dev/stderr crit;

    # The limit of a message of the core (17 MiB).
    client_max_body_size 17m;

    location ~ ^/(api(/|$)|mcp(/|$)|healthz(/|$)|openapi\.json$) {
        set $backend http://backend:8080;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Connection "";
        # The compose backend has TRUST_PROXY=true. Overwrite the header: a client cannot forge it.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # The streams (SSE) must arrive at once, and a send can wait 6 minutes.
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 370s;
        proxy_send_timeout 370s;
    }

    location / {
        set $frontend http://frontend:8080;
        proxy_pass $frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-For $remote_addr;
    }
}

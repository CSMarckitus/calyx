# The static server of the frontend. The image copies this file to /etc/nginx/conf.d/default.conf.
# The first match wins. The list of backend paths and the core path is the same as in
# gateway.conf and in README.md: change the three together.

server {
    listen 8080;
    listen [::]:8080;
    server_name _;
    root /usr/share/nginx/html;

    server_tokens off;
    # An address can hold a token, so nothing writes it.
    access_log off;
    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml;

    # Rule 1. A backend path or the core path answers 503 with any method. A stopped backend
    # never gets a page of HTML with the status 200.
    location ~ ^/(api(/|$)|mcp(/|$)|healthz(/|$)|openapi\.json$|meta/webhook(/|$)) {
        include /etc/nginx/calyx/headers.conf;
        # An empty types block, so "openapi.json" does not get the type application/json.
        types { }
        default_type text/plain;
        return 503 "The Calyx backend is not reachable.\n";
    }

    # A path with a part that starts with a dot is never served, for example /.vite/manifest.json.
    location ~ /\. {
        include /etc/nginx/calyx/headers.conf;
        return 404;
    }

    # Rule 4. A missing file in /assets/ is a 404. The names hold a hash, so the files never change.
    location ^~ /assets/ {
        include /etc/nginx/calyx/headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        # Rule 2.
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }
        try_files $uri =404;
    }

    # The three files that the page reads again must never come from a cache.
    location ~ ^/(index\.html|theme\.js|version\.json)$ {
        include /etc/nginx/calyx/headers.conf;
        add_header Cache-Control "no-cache" always;
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }
        try_files $uri =404;
    }

    # The docs page is a second HTML page with its own CSP (headers-docs.conf). The rule is the same
    # as in vite.config.ts: /docs, /docs/ and /docs/index.html.
    location ~ ^/docs(/|/index\.html)?$ {
        include /etc/nginx/calyx/headers-docs.conf;
        add_header Cache-Control "no-cache" always;
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }
        try_files /docs/index.html =404;
    }

    # Rule 3, then rule 5: a file that exists, or index.html for the router of the page.
    location / {
        include /etc/nginx/calyx/headers.conf;
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }
        try_files $uri /index.html;
    }
}

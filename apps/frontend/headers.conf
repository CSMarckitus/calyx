# The source of the security headers of the panel. headers-docs.conf is the source for /docs.
# nginx.conf includes this file in each location except the docs location. vite.config.ts reads it for the preview.
add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

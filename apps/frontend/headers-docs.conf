# The security headers of /docs: the headers of the panel plus one style exception.
# Reason: Scalar adds <style> elements and inline style attributes, and a nonce cannot allow them.
# The CSP adds style-src 'self' 'unsafe-inline'. It has no 'unsafe-eval' and no script exception.
add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; frame-ancestors 'none'; base-uri 'none'; form-action 'self'; style-src 'self' 'unsafe-inline'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 600" width="1100" height="600" role="img" aria-labelledby="title desc" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="title">The layers of Calyx</title>
  <desc id="desc">Three rings. The core is in the centre: the instance lifecycle, pacing, sending and events. The backend is the ring around it: users, tenants, API keys, alerts and the MCP server. The outer ring holds the ways in: the panel and /docs, the client SDKs, plain HTTP and MCP clients. The core connects to WhatsApp Web and the Meta Cloud API. A client SDK can connect to either layer: to the backend over HTTP, or to the core alone over gRPC. The VB6 SDK reaches only the backend.</desc>
  <style>
    .outer { fill: #eef3fb; stroke: #9db5de; }
    .middle { fill: #d3e0f5; stroke: #5b82c6; }
    .inner { fill: #2c61b7; stroke: #1d4a97; }
    .box { fill: #ffffff; stroke: #5b82c6; }
    .title { fill: #0f2550; font-weight: 700; font-size: 18px; }
    .text { fill: #253d66; font-size: 14px; }
    .core-title { fill: #ffffff; font-weight: 700; font-size: 20px; }
    .core-text { fill: #e6eefb; font-size: 14px; }
    .line { stroke: #2c61b7; stroke-width: 2; fill: none; }
    .dash { stroke-dasharray: 6 5; }
    .arrow { fill: #2c61b7; }
    @media (prefers-color-scheme: dark) {
      .outer { fill: #131b2a; stroke: #3a5687; }
      .middle { fill: #1b2b47; stroke: #4f74b8; }
      .inner { fill: #2c61b7; stroke: #8fb3ee; }
      .box { fill: #0d1117; stroke: #4f74b8; }
      .title { fill: #e6eefb; }
      .text { fill: #b9cbea; }
      .core-title { fill: #ffffff; }
      .core-text { fill: #f0f5fd; }
      .line { stroke: #8fb3ee; }
      .arrow { fill: #8fb3ee; }
    }
  </style>
  <defs>
    <marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path class="arrow" d="M0 0 L10 5 L0 10 z"/>
    </marker>
  </defs>

  <circle class="outer" cx="560" cy="300" r="280" stroke-width="2"/>
  <circle class="middle" cx="560" cy="300" r="190" stroke-width="2"/>
  <circle class="inner" cx="560" cy="300" r="100" stroke-width="2"/>

  <text class="title" x="560" y="58" text-anchor="middle">Ways in</text>
  <text class="text" x="560" y="80" text-anchor="middle">Panel and /docs · client SDKs</text>
  <text class="text" x="560" y="100" text-anchor="middle">plain HTTP · MCP clients</text>

  <text class="title" x="560" y="148" text-anchor="middle">Backend</text>
  <text class="text" x="560" y="170" text-anchor="middle">users · tenants · API keys</text>
  <text class="text" x="560" y="190" text-anchor="middle">alerts · MCP server</text>

  <text class="core-title" x="560" y="268" text-anchor="middle">Core</text>
  <text class="core-text" x="560" y="292" text-anchor="middle">instance lifecycle</text>
  <text class="core-text" x="560" y="310" text-anchor="middle">pacing · sending</text>
  <text class="core-text" x="560" y="328" text-anchor="middle">events</text>

  <rect class="box" x="20" y="225" width="190" height="150" rx="12" stroke-width="2"/>
  <text class="title" x="115" y="262" text-anchor="middle">Client SDK</text>
  <text class="text" x="115" y="290" text-anchor="middle">TypeScript · Go · PHP</text>
  <text class="text" x="115" y="310" text-anchor="middle">Python · VB6</text>
  <text class="text" x="115" y="345" text-anchor="middle">(VB6: backend only)</text>

  <path class="line" d="M210 262 L369 262" marker-end="url(#head)"/>
  <text class="text" x="222" y="252">HTTP: the backend</text>
  <path class="line dash" d="M210 338 L462 338" marker-end="url(#head)"/>
  <text class="text" x="222" y="360">gRPC: the core alone</text>

  <path class="line" d="M660 300 L896 300" marker-end="url(#head)"/>
  <rect class="box" x="900" y="250" width="190" height="100" rx="12" stroke-width="2"/>
  <text class="title" x="995" y="288" text-anchor="middle">WhatsApp Web</text>
  <text class="text" x="995" y="310" text-anchor="middle">or</text>
  <text class="title" x="995" y="334" text-anchor="middle">Meta Cloud API</text>
</svg>
